[mod]
id = "mynethersdelight"
name = "My Nether's Delight Refabricated"
group = "com.soytutta"
# {port:major.minor.fix}-{base:major.minor.fix (without last)}
version = "3.0.0-1.10.4"
channel_tag = "-alpha.1"
description = "A nether expansion for the Farmer's Delight mod!"
authors = ["rotgruengelb", "SoyTutta"]
contributors = ["Mpustovoi", "Unroman", "ChuijkYahus", "SlimeSB", "RaymondBlaze", "TCGhost", "Sarinsa", "Umpaz", "SoyTutta", "rotgruengelb", "MerchantCalico", "cassiancc"]
inception_year = "2026"
license.name = "ARR"
license.url = ""
license.dist = "repo"
sources_url = "https://github.com/rotgruengelb/my-nethers-delight-refabricated"
homepage_url = "https://github.com/rotgruengelb/my-nethers-delight-refabricated"
issues_url = "https://github.com/rotgruengelb/my-nethers-delight-refabricated/issues"
discord_url = "https://discord.gg/zEUqJYBang"
environment = "client_and_server"
dev_jvm_args = [
	"-XX:+IgnoreUnrecognizedVMOptions",
	"-XX:+UseZGC",
	"-XX:+HeapDumpOnOutOfMemoryError",
	"-XX:HeapDumpPath=heapdump.hprof",
	"-XX:+ShowCodeDetailsInExceptionMessages",
	"-XX:+UseCompactObjectHeaders",
	"-XX:+AlwaysPreTouch",
	"-XX:+UseStringDeduplication",
	"-Dfile.encoding=UTF-8"
]
dev_jvm_args_mixin_debug = [
	"-Dmixin.env.remapRefMap=true",
	"-Dmixin.debug.verbose=true",
	"-Dmixin.debug.verify=true",
	"-Dmixin.debug.countInjections=true",
	"-Dmixin.debug=true",
	"-Dmixin.debug.export=true"
]

[[mod.pom.developers]]
id = "rotgruengelb"
name = "rotgruengelb"
url = "https://github.com/rotgruengelb"
[[mod.pom.developers]]
id = "soytutta"
name = "SoyTutta"
url = "https://github.com/SoyTutta"

